name: macOS ARM

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  gui:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.96.1
      - name: Restore Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            subprojects/magpie/target
          key: macos-arm-1.96.1-${{ hashFiles('Cargo.lock', 'subprojects/magpie/Cargo.lock') }}
      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path subprojects/magpie/Cargo.toml --all --check
      - name: Clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --manifest-path subprojects/magpie/Cargo.toml -p magpie -p magpie-platform-macos --all-targets -- -D warnings
      - name: GUI and platform-independent tests
        run: |
          cargo test --locked -p mc-graph-core -p mc-core -p mc-graph -p mc-ui
          cargo test --locked -p taskmanager-app --no-default-features --features wgpu,production-logging
          cargo test --locked -p mc-magpie sockets::tests
          cargo test --locked --manifest-path subprojects/magpie/Cargo.toml -p magpie-platform-macos -p magpie-types
      - name: Build native app bundle
        run: bash support/macos/build.sh
      - name: Verify ARM binaries and live telemetry
        shell: bash
        run: |
          file target/macos/'Task Manager.app'/Contents/MacOS/*
          python3 support/macos/verify.py
      - name: Archive ad-hoc signed bundle
        run: ditto -c -k --sequesterRsrc --keepParent target/macos/'Task Manager.app' target/macos/taskmanager-macos-arm64.zip
      - name: Upload experimental app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: taskmanager-macos-arm64
          path: target/macos/taskmanager-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload actual Metal offscreen renders
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: taskmanager-macos-arm64-ui-renders
          path: target/ui-snapshots/*.png
          if-no-files-found: error
          retention-days: 14
