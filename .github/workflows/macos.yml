name: macOS ARM GUI preview

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  gui:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.96.1
      - name: Restore Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm-1.96.1-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: GUI and platform-independent tests
        run: |
          cargo test --locked -p mc-graph-core -p mc-core -p mc-graph -p mc-ui
          cargo test --locked -p taskmanager-app --no-default-features --features wgpu,production-logging
          cargo test --locked -p mc-magpie sockets::tests
      - name: Build native GUI preview
        run: >-
          cargo build --locked --release -p taskmanager-app
          --no-default-features --features wgpu,production-logging
      - name: Reject unavailable live source without starting a daemon
        shell: bash
        run: |
          file target/release/taskmanager | tee target/macos-binary.txt
          rg 'Mach-O 64-bit executable arm64' target/macos-binary.txt
          check_rejected() {
            set +e
            target/release/taskmanager "$@" >target/macos-live-error.txt 2>&1
            status=$?
            set -e
            test "$status" = 2
            rg 'Live collection is not yet supported on macOS' target/macos-live-error.txt
          }
          check_rejected --no-config
          check_rejected --synthetic 5 --dump-readings 1 target/should-not-exist
          test ! -e target/should-not-exist
      - name: Upload unsigned preview binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: taskmanager-macos-arm64-synthetic-preview
          path: target/release/taskmanager
          if-no-files-found: error
          retention-days: 14
      - name: Upload actual Metal offscreen renders
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: taskmanager-macos-arm64-ui-renders
          path: target/ui-snapshots/*.png
          if-no-files-found: error
          retention-days: 14
