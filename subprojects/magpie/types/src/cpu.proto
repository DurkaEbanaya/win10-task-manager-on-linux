syntax = "proto2";

package magpie.cpu;

message Cpu {
  optional string name = 1;
  optional uint32 socket_count = 2;
  optional uint64 base_freq_khz = 3;
  optional string virtualization_technology = 4;
  optional bool is_virtual_machine = 5;
  optional uint64 l1_combined_cache_bytes = 6;
  optional uint64 l2_cache_bytes = 7;
  optional uint64 l3_cache_bytes = 8;
  optional uint64 l4_cache_bytes = 9;

  required float total_usage_percent = 10;
  required float kernel_usage_percent = 11;
  repeated float core_usage_percent = 12;
  repeated float core_kernel_usage_percent = 13;
  required uint64 current_frequency_mhz = 14;
  optional float temperature_celsius = 15;
  required uint64 total_process_count = 16;
  required uint64 total_thread_count = 17;
  required uint64 total_handle_count = 18;
  required uint64 uptime_seconds = 19;
  optional string frequency_driver = 20;
  optional string frequency_governor = 21;
  optional string power_preference = 22;
  optional float power_draw_w = 23;
  repeated LogicalCpu logical_cpus = 24;
  optional float voltage_v = 25;
  optional float bclk_mhz = 26;
  // Absent retains legacy semantics. False means the required scalar is unavailable.
  optional bool usage_valid = 27;
  optional bool frequency_valid = 28;
  optional bool process_count_valid = 29;
  optional bool thread_count_valid = 30;
  optional bool handle_count_valid = 31;
  optional uint32 physical_core_count = 32;
  // Aggregate kernel-reported groups, not a mapping of Mach CPU array ordinals.
  repeated PerformanceLevel performance_levels = 33;
  // Platform semantics for the CPU view; absent retains legacy/Linux labels.
  optional bool darwin_cpu = 34;
  // kern.num_files: system-wide open file objects, NOT Windows handles or FDs summed over PIDs.
  optional uint64 darwin_open_file_count = 35;
  // Sum of top #PORTS across a complete sample; occupied Mach IPC names, not Windows handles.
  optional uint64 darwin_mach_port_count = 36;
}

message PerformanceLevel {
  required uint32 index = 1;
  optional string name = 2;
  required uint32 physical_core_count = 3;
  optional uint32 logical_cpu_count = 4;
  optional uint64 l1_instruction_bytes = 5;
  optional uint64 l1_data_bytes = 6;
  optional uint64 l2_bytes = 7;
  // IOReport cluster active-residency average, not an instantaneous core clock.
  optional float active_frequency_mhz = 8;
  // Native DVFS table bounds, not base/boost guarantees or live clocks.
  optional float minimum_frequency_mhz = 9;
  optional float maximum_frequency_mhz = 10;
}

message LogicalCpu {
  required uint32 id = 1;
  optional uint32 package_id = 2;
  optional uint32 core_id = 3;
  optional string kind = 4;
}

message CpuRequest {}

message CpuResponse {
  oneof response {
    Cpu cpu = 1;
    CpuResponseError error = 2;
  }
}

message CpuResponseError {}
