[package]
name = "magpie-platform-macos"
version = "1.2.0"
edition = "2021"
rust-version = "1.92"

[dependencies]
magpie-platform = { path = "../platform" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
log = "0.4"
mach2 = "0.7"
core-foundation = "0.10"
sysinfo = { version = "0.37.2", default-features = false, features = ["system", "disk", "network"] }
